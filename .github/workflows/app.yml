# Checks the Polyscan app itself: analyzer, unit/widget tests, Android debug build,
# and the real scan pipeline on an Android emulator.
name: App – analyze, test, build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'spikes/**'
      - '**.md'
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze lib test integration_test 2>&1 | tee analyze.log

      - name: Unit and widget tests
        run: flutter test 2>&1 | tee test.log

      - name: Build Android APK
        run: flutter build apk --debug 2>&1 | tee build.log

      - name: Log tails on failure
        if: failure()
        run: |
          # Annotations are readable without signing in (logs and step summaries are not).
          for f in analyze.log test.log build.log; do
            [ -f "$f" ] || continue
            echo "::warning title=$f tail::$(tail -n 40 "$f" | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,200)}')"
          done

  # Compiles the app for the iOS simulator (no signing), so the Swift plugins build.
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Same cache key as ocr-ios.yml, so the xcframework is usually restored.
      - name: Cache Tesseract xcframework
        uses: actions/cache@v4
        with:
          path: packages/polyscan_ocr/ios/polyscan_ocr/TesseractC.xcframework
          key: tesseract-${{ runner.os }}-${{ hashFiles('packages/polyscan_ocr/ios/scripts/build_tesseract.sh') }}

      - name: Build Tesseract xcframework
        run: |
          chmod +x packages/polyscan_ocr/ios/scripts/build_tesseract.sh
          packages/polyscan_ocr/ios/scripts/build_tesseract.sh 2>&1 | tee tesseract-build.log

      - name: Build for the iOS simulator
        run: |
          flutter pub get
          flutter build ios --simulator --debug 2>&1 | tee build.log

      - name: Log tails on failure
        if: failure()
        run: |
          for f in tesseract-build.log build.log; do
            [ -f "$f" ] || continue
            echo "::warning title=$f errors::$(grep -E "error:|Error|failed" "$f" | head -n 30 | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,220)}')"
            echo "::warning title=$f tail::$(tail -n 30 "$f" | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,220)}')"
          done

  # The real pipeline (render, Tesseract, searchable PDF) on an Android emulator.
  pipeline-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-x64 2>&1 | tee build.log

      - name: Run pipeline test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # logcat shows crashes at app launch, which flutter test only reports as a hang.
          script: |
            adb logcat -c
            bash -c 'adb logcat -v time > "$GITHUB_WORKSPACE/logcat.txt" 2>&1 &'
            # flutter test sometimes hangs right after installing the app (2 of 3 runs on
            # 2026-10-07, no app change in between); retry once after a timeout.
            bash -c 'set -o pipefail; for try in 1 2; do timeout 600 flutter test integration_test -d emulator-5554 --reporter expanded 2>&1 | tee -a "$GITHUB_WORKSPACE/integration-test.log"; s=$?; [ $s -eq 124 ] && [ $try -eq 1 ] && { echo "::warning title=retry::flutter test hung for 10 min; retrying once"; continue; }; exit $s; done'

      - name: Report results as annotations
        if: always()
        run: |
          [ -f integration-test.log ] || exit 0
          grep -oE "PIPELINE_RESULT .*" integration-test.log | sed 's/^/::notice title=pipeline::/' || true
          if [ "${{ job.status }}" != "success" ]; then
            for f in integration-test.log; do
              [ -f "$f" ] || continue
              echo "::warning title=$f tail::$(tail -n 15 "$f" | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,200)}')"
            done
            if [ -f logcat.txt ]; then
              grep -E "FATAL|AndroidRuntime|E/flutter|polyscan|Tesseract|UnsatisfiedLink|DEBUG  :|signal [0-9]+" logcat.txt > logcat-errors.txt || true
              echo "::warning title=logcat errors (first 60)::$(head -n 60 logcat-errors.txt | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,220)}')"
              echo "::warning title=logcat tail::$(tail -n 40 logcat.txt | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,220)}')"
            fi
          fi
