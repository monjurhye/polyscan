# Checks the Polyscan app itself: analyzer, unit/widget tests, Android debug build,
# and the real scan pipeline on an Android emulator.
name: App – analyze, test, build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'spikes/**'
      - '**.md'
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze lib test integration_test 2>&1 | tee analyze.log

      - name: Unit and widget tests
        run: flutter test 2>&1 | tee test.log

      - name: Build Android APK
        run: flutter build apk --debug 2>&1 | tee build.log

      - name: Log tails on failure
        if: failure()
        run: |
          # Annotations are readable without signing in (logs and step summaries are not).
          for f in analyze.log test.log build.log; do
            [ -f "$f" ] || continue
            echo "::warning title=$f tail::$(tail -n 40 "$f" | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,200)}')"
          done

  # The real pipeline (render, Tesseract, searchable PDF) on an Android emulator.
  pipeline-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-x64 2>&1 | tee build.log

      - name: Run pipeline test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash -c 'set -o pipefail; flutter test integration_test -d emulator-5554 --reporter expanded 2>&1 | tee "$GITHUB_WORKSPACE/integration-test.log"'

      - name: Report results as annotations
        if: always()
        run: |
          [ -f integration-test.log ] || exit 0
          grep -oE "PIPELINE_RESULT .*" integration-test.log | sed 's/^/::notice title=pipeline::/' || true
          if [ "${{ job.status }}" != "success" ]; then
            for f in build.log integration-test.log; do
              [ -f "$f" ] || continue
              echo "::warning title=$f tail::$(tail -n 40 "$f" | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,200)}')"
            done
          fi
