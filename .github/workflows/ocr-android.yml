# Runs the polyscan_ocr plugin's integration test (real OCR on bundled samples)
# on an Android emulator, using Tesseract4Android. Android twin of ocr-ios.yml.
name: OCR plugin – Android emulator test

on:
  push:
    branches: [main]
    paths:
      - 'packages/polyscan_ocr/**'
      - '.github/workflows/ocr-android.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Plugin unit tests
        run: |
          cd packages/polyscan_ocr/example
          flutter pub get
          flutter build apk --debug --target-platform android-x64 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          cd android
          sh ./gradlew :polyscan_ocr:testDebugUnitTest 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Run integration test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: packages/polyscan_ocr/example
          script: |
            bash -c 'set -o pipefail; flutter test integration_test -d emulator-5554 --reporter expanded 2>&1 | tee "$GITHUB_WORKSPACE/integration-test.log"'

      - name: OCR summary
        if: always()
        run: |
          grep -E "OCR_RESULT|OCR_TEXT" integration-test.log | tee ocr-summary.txt || true
          {
            echo '## OCR summary'
            echo '```'
            cat ocr-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-android-logs
          path: |
            build.log
            integration-test.log
            ocr-summary.txt
          if-no-files-found: ignore
