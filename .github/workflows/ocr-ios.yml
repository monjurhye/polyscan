# Builds Tesseract for iOS and runs the polyscan_ocr plugin's integration test
# (real OCR on bundled samples) on an iOS simulator. Same job as the
# ocr-plugin-ios-test workflow in codemagic.yaml.
name: OCR plugin – iOS simulator test

on:
  push:
    branches: [main]
    paths:
      - 'packages/polyscan_ocr/**'
      - '.github/workflows/ocr-ios.yml'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tool versions
        run: |
          flutter --version
          xcodebuild -version
          cmake --version || true
          xcrun simctl list runtimes
          echo "::notice title=versions::$(flutter --version | head -1) / $(xcodebuild -version | head -1) $(xcodebuild -version | tail -1)"

      - name: Cache Tesseract xcframework
        uses: actions/cache@v4
        with:
          path: packages/polyscan_ocr/ios/polyscan_ocr/TesseractC.xcframework
          key: tesseract-${{ runner.os }}-${{ hashFiles('packages/polyscan_ocr/ios/scripts/build_tesseract.sh') }}

      - name: Build Tesseract xcframework
        run: |
          chmod +x packages/polyscan_ocr/ios/scripts/build_tesseract.sh
          packages/polyscan_ocr/ios/scripts/build_tesseract.sh 2>&1 | tee tesseract-build.log

      - name: Run integration test on iOS simulator
        timeout-minutes: 30
        run: |
          cd packages/polyscan_ocr/example
          flutter pub get
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "Simulator: $DEVICE"
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "::notice title=simulator::$(xcrun simctl list devices | grep "$DEVICE")"
          boot() {
            xcrun simctl boot "$DEVICE" || true
            # Wait until the simulator has fully booted before Flutter installs the app.
            xcrun simctl bootstatus "$DEVICE" -b
          }
          # The app sometimes never reports back after "Xcode build done" and flutter test
          # hangs until the step times out. Cap each attempt; retry once on a wiped simulator.
          run_test() {
            # No tee: children left behind by a killed flutter would keep the pipe open.
            local log="$GITHUB_WORKSPACE/integration-test.log" start
            start=$(wc -l < "$log" 2>/dev/null || echo 0)
            perl -e 'alarm shift; exec @ARGV' 720 \
              flutter test integration_test -d "$DEVICE" --reporter expanded >> "$log" 2>&1
            local status=$?
            tail -n +$((start + 1)) "$log"
            return $status
          }
          boot
          set +e
          run_test
          STATUS=$?
          if [ $STATUS -eq 142 ]; then
            echo "::warning title=retry::flutter test hung for 12 min; erasing the simulator and retrying once"
            echo "===== RETRY on a wiped simulator" | tee -a "$GITHUB_WORKSPACE/integration-test.log"
            pkill -f "flutter_tools" || true
            xcrun simctl shutdown "$DEVICE" || true
            xcrun simctl erase "$DEVICE"
            boot
            run_test
            STATUS=$?
          fi
          echo "===== OCR summary"
          grep -E "OCR_RESULT|OCR_TEXT" "$GITHUB_WORKSPACE/integration-test.log" | tee "$GITHUB_WORKSPACE/ocr-summary.txt"
          {
            echo '## OCR summary'
            echo '```'
            cat "$GITHUB_WORKSPACE/ocr-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Report results as annotations
        if: always()
        run: |
          # Annotations are readable without signing in (logs and step summaries are not).
          [ -f integration-test.log ] || exit 0
          grep -oE "OCR_RESULT .*" integration-test.log | sed 's/^/::notice title=OCR::/' || true
          if [ "${{ job.status }}" != "success" ]; then
            echo "::warning title=integration-test.log tail::$(tail -n 40 integration-test.log | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,200)}')"
          fi

      - name: Collect simulator logs
        if: always() && env.SIM_DEVICE != ''
        run: |
          xcrun simctl spawn "$SIM_DEVICE" log show --last 40m --style compact             --predicate 'process == "Runner" OR eventMessage CONTAINS[c] "polyscan"' > simulator.log 2>&1 || true
          tail -n 200 simulator.log || true
          echo "::notice title=simulator.log tail::$(tail -n 30 simulator.log | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", substr($0,1,200)}')"
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/Runner* crash-reports/ 2>/dev/null || true
          ls -la crash-reports

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-ios-logs
          path: |
            tesseract-build.log
            integration-test.log
            ocr-summary.txt
            simulator.log
            crash-reports/
          if-no-files-found: ignore
