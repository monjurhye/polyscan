# Does the shrunk (R8) release build start on Android? Installs a release APK with Google's
# test ads on emulators and records logcat and screenshots. Signed with debug keys, since the
# upload key is not in this public repo. Results go to a release-launch-api<level> branch,
# which is readable without signing in.
name: Android release launch

on:
  push:
    branches: ['ci/release-launch']
    paths:
      - '.github/workflows/android-release-launch.yml'
      - '.github/scripts/android_release_launch.sh'
      - 'lib/**'
      - 'android/**'
      - 'polyscan_ocr/**'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 29]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build release APK
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release --target-platform android-x64

      - name: Launch on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/android_release_launch.sh

      - name: Publish results
        if: always()
        run: |
          mkdir -p launch-results
          cd launch-results
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q --allow-empty -m "Release launch on API ${{ matrix.api-level }} from ${GITHUB_SHA::7}"
          # The checkout's token, which actions/checkout stored in the repo's own config.
          TOKEN_HEADER=$(git -C "$GITHUB_WORKSPACE" config --get-regexp '^http\..*\.extraheader$' | cut -d' ' -f2-)
          git -c http.https://github.com/.extraheader="$TOKEN_HEADER" push -f "https://github.com/$GITHUB_REPOSITORY.git" results:release-launch-api${{ matrix.api-level }}
