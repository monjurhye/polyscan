# Google Play screenshots from the real app on an Android emulator: phone (1080x1920) and
# tablet (1600x2560). The debug app runs in screenshot mode (lib/screenshot_mode.dart):
# sample documents, no ads, one launch per scene. Started by hand; download the artifact.
name: Play screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-x64

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/play_screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-screenshots
          path: store/play/screenshots/
