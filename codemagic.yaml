workflows:
  # Builds Tesseract for iOS and runs the polyscan_ocr plugin's integration
  # test (real OCR on bundled samples) on an iOS simulator. No signing needed.
  ocr-plugin-ios-test:
    name: OCR plugin – iOS simulator test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Tool versions
        script: |
          flutter --version
          xcodebuild -version
          cmake --version || true
      - name: Build Tesseract xcframework
        script: |
          set -o pipefail
          chmod +x packages/polyscan_ocr/ios/scripts/build_tesseract.sh
          packages/polyscan_ocr/ios/scripts/build_tesseract.sh 2>&1 | tee tesseract-build.log
      - name: Run integration test on iOS simulator
        script: |
          cd packages/polyscan_ocr/example
          flutter pub get
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          set +e
          flutter test integration_test -d "$DEVICE" --reporter expanded 2>&1 | tee "$CM_BUILD_DIR/integration-test.log"
          STATUS=${PIPESTATUS[0]}
          echo "===== OCR summary"
          grep -E "OCR_RESULT|OCR_TEXT" "$CM_BUILD_DIR/integration-test.log" | tee "$CM_BUILD_DIR/ocr-summary.txt"
          exit $STATUS
    artifacts:
      - tesseract-build.log
      - integration-test.log
      - ocr-summary.txt

  # Signed App Store build, uploaded to App Store Connect (TestFlight). Started by hand.
  # Needs the environment variable group "admob" (ADMOB_IOS_APP_ID, ADMOB_IOS_BANNER,
  # ADMOB_IOS_INTERSTITIAL, ADMOB_IOS_APP_OPEN from the AdMob console) and, in the
  # Codemagic team: the App Store Connect API key integration
  # "app_store_key" and an Apple Distribution certificate (with private key) under
  # Code signing identities. Codemagic fetches or creates the App Store
  # provisioning profile for com.pickixo.polyscan itself. The app must already
  # exist in App Store Connect for the upload.
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: app_store_key
    environment:
      xcode: latest
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pickixo.polyscan
      groups:
        - admob
    scripts:
      - name: Check AdMob IDs
        script: |
          # Release builds must show real ads; Google's test IDs would earn nothing.
          for v in ADMOB_IOS_APP_ID ADMOB_IOS_BANNER ADMOB_IOS_INTERSTITIAL ADMOB_IOS_APP_OPEN; do
            [ -n "${!v}" ] || { echo "Missing $v in the Codemagic group 'admob'"; exit 1; }
            case "${!v}" in ca-app-pub-3940256099942544*) echo "$v is Google's test ID"; exit 1;; esac
          done
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_IOS_APP_ID" ios/Runner/Info.plist
      - name: Build Tesseract xcframework
        script: |
          set -o pipefail
          chmod +x packages/polyscan_ocr/ios/scripts/build_tesseract.sh
          packages/polyscan_ocr/ios/scripts/build_tesseract.sh 2>&1 | tee tesseract-build.log
      - name: Get packages
        script: flutter pub get
      - name: Use provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          # Codemagic's per-workflow counter always grows, so TestFlight never sees a repeat.
          # The version (1.0.0) comes from pubspec.yaml; raise it by hand for each App Store release.
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=ADMOB_IOS_BANNER="$ADMOB_IOS_BANNER" \
            --dart-define=ADMOB_IOS_INTERSTITIAL="$ADMOB_IOS_INTERSTITIAL" \
            --dart-define=ADMOB_IOS_APP_OPEN="$ADMOB_IOS_APP_OPEN" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Check the IPA
        script: |
          IPA=$(ls build/ios/ipa/*.ipa)
          unzip -l "$IPA" | tail -1
          # The bundled English model must be inside, or OCR fails offline on first launch.
          unzip -l "$IPA" | grep -q "eng.traineddata" || { echo "eng.traineddata missing from the IPA"; exit 1; }
          # Test-only sample images must never ship.
          if unzip -l "$IPA" | grep -q "integration_test"; then echo "integration_test files in the IPA"; exit 1; fi
    artifacts:
      - build/ios/ipa/*.ipa
      - tesseract-build.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  # Unsigned simulator build, zipped for Appetize.io (upload Polyscan-simulator.zip
  # there). The simulator has no camera: test with "Import" and photos dragged in.
  # It shows Google's test ads, which are safe to tap.
  ios-simulator:
    name: iOS simulator build (Appetize)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
    scripts:
      - name: Build Tesseract xcframework
        script: |
          set -o pipefail
          chmod +x packages/polyscan_ocr/ios/scripts/build_tesseract.sh
          # Appetize may run Intel simulators, so include the x86_64 slice.
          SIM_X86_64=1 packages/polyscan_ocr/ios/scripts/build_tesseract.sh 2>&1 | tee tesseract-build.log
      - name: Build for the simulator
        script: |
          flutter pub get
          # Flutter builds simulator apps only in debug mode.
          flutter build ios --simulator --debug
          cd build/ios/iphonesimulator
          zip -qr "$CM_BUILD_DIR/Polyscan-simulator.zip" Runner.app
    artifacts:
      - Polyscan-simulator.zip
      - tesseract-build.log

  # App Store screenshots for iPhone 6.9", iPhone 6.5" and iPad 13", plus the same
  # simulator build zipped for Appetize. The app runs in screenshot mode
  # (lib/screenshot_mode.dart): sample documents, no ads, one launch per scene.
  ios-screenshots:
    name: App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 75
    environment:
      xcode: latest
      flutter: stable
    scripts:
      - name: Build Tesseract xcframework
        script: |
          set -o pipefail
          chmod +x packages/polyscan_ocr/ios/scripts/build_tesseract.sh
          SIM_X86_64=1 packages/polyscan_ocr/ios/scripts/build_tesseract.sh 2>&1 | tee tesseract-build.log
      - name: Build for the simulator
        script: |
          flutter pub get
          flutter build ios --simulator --debug
          cd build/ios/iphonesimulator
          zip -qr "$CM_BUILD_DIR/Polyscan-simulator.zip" Runner.app
      - name: Take screenshots
        script: |
          set -e
          APP=build/ios/iphonesimulator/Runner.app
          BUNDLE=com.pickixo.polyscan
          OUT="$CM_BUILD_DIR/screenshots"
          mkdir -p "$OUT"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          pick() { xcrun simctl list devicetypes -j | python3 -c "import json,sys,re; t=[d for d in json.load(sys.stdin)['devicetypes'] if re.fullmatch(sys.argv[1], d['name'])]; t.sort(key=lambda d: [int(n) for n in re.findall(r'\d+', d['name'])]); print(t[-1]['identifier']); print('Using', t[-1]['name'], file=sys.stderr)" "$1"; }
          # The app reads its scene from Documents/screenshot_scene.txt (lib/screenshot_mode.dart).
          launch() {
            local data=$(xcrun simctl get_app_container "$1" "$BUNDLE" data)
            mkdir -p "$data/Documents"
            printf "%s" "$2" > "$data/Documents/screenshot_scene.txt"
            xcrun simctl launch "$1" "$BUNDLE"
          }
          shoot() {
            local label="$1" type="$2"
            local udid=$(xcrun simctl create "$label" "$type" "$RUNTIME")
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl install "$udid" "$APP"
            # Warm-up: first-boot system banners appear and time out here, not on a screenshot.
            launch "$udid" documents
            sleep 60
            local n=1
            for scene in documents bangla page arabic languages; do
              xcrun simctl terminate "$udid" "$BUNDLE" 2>/dev/null || true
              launch "$udid" "$scene"
              # Debug builds start slower (JIT); pages are drawn at launch.
              sleep 15
              xcrun simctl io "$udid" screenshot "$OUT/${label}-${n}-${scene}.png"
              n=$((n+1))
            done
            xcrun simctl shutdown "$udid"
          }
          shoot iPhone-6.9 "$(pick 'iPhone \d+ Pro Max')"
          shoot iPhone-6.5 "$(pick 'iPhone 11 Pro Max')"
          shoot iPad-13 "$(pick 'iPad Pro 13-inch.*')"
          for f in "$OUT"/*.png; do echo "$(basename "$f") $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')"; done
          cd "$CM_BUILD_DIR" && zip -qr Polyscan-screenshots.zip screenshots
    artifacts:
      - Polyscan-screenshots.zip
      - screenshots/*.png
      - Polyscan-simulator.zip
      - tesseract-build.log

  # Signed App Store IPA for the App Review video on a real iPhone in Kobiton
  # (Kobiton re-signs it). Same as ios-release except: Google's test ad units
  # (no "admob" group), sample documents saved on first launch
  # (POLYSCAN_DEMO, lib/screenshot_mode.dart), and nothing is uploaded.
  ios-devicefarm:
    name: iOS review-video build (Kobiton, test ads)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: app_store_key
    environment:
      xcode: latest
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pickixo.polyscan
    scripts:
      - name: Build Tesseract xcframework
        script: |
          set -o pipefail
          chmod +x packages/polyscan_ocr/ios/scripts/build_tesseract.sh
          packages/polyscan_ocr/ios/scripts/build_tesseract.sh 2>&1 | tee tesseract-build.log
      - name: Get packages
        script: flutter pub get
      - name: Use provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA with test ads and sample documents
        script: |
          # Info.plist keeps Google's test AdMob app ID; the Dart side falls back to test units.
          flutter build ipa --release             --build-number="$BUILD_NUMBER"             --dart-define=POLYSCAN_DEMO=true             --export-options-plist=/Users/builder/export_options.plist
          mv build/ios/ipa/*.ipa build/ios/ipa/Polyscan-review-video-testads.ipa
          unzip -l build/ios/ipa/Polyscan-review-video-testads.ipa | tail -1
    artifacts:
      - build/ios/ipa/*.ipa
      - tesseract-build.log
      - /tmp/xcodebuild_logs/*.log
